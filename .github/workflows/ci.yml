# PR 和 main 的检查：脚本/前端单测、构建、Rust 测试和 Clippy，Windows 和 Ubuntu 各跑一遍
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux 编译 Tauri 需要的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev cmake libsodium-dev
      - name: 构建固定版本的 minisign
        if: runner.os == 'Linux'
        run: bash scripts/install-minisign.sh "$RUNNER_TEMP" && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: npm 依赖审计
        run: npm audit --audit-level=high
      - name: 三处版本号一致
        run: node scripts/version.mjs check
      - name: npm test（不允许新的 warning）
        run: npm test
        env:
          RUSTFLAGS: -D warnings
      - name: cargo clippy（不允许警告）
        run: npm run lint:rust
        env:
          RUSTFLAGS: -D warnings
