# 发版：推送 v* tag（如 v0.1.0）后打包 Windows / macOS / Linux 安装包，全部成功后一次性创建并发布 Release（设为 Latest）。
# 打包过程中不碰 Release：各平台的安装包先作为这次运行的 artifact 存着，有一个平台失败就什么都不发布；
# 偶发问题修好后在这次运行里点「Re-run failed jobs」，已经成功的平台不用重打。
# 步骤见 README 的「发版」。
name: 发版

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "目标版本 tag（如 v0.1.0）；正式发布必须已推送，dry-run 可配合 build_ref 检查未打 tag 的代码"
        required: true
      dry_run:
        description: "只打包、核对，不发布（试新的发版流程用，安装包在这次运行的 Artifacts 里）"
        type: boolean
        default: false
      signed_updates:
        description: "额外生成应用内更新包（需正确的签名密钥、密码及公钥）；默认仅普通安装包"
        type: boolean
        default: false
      build_ref:
        description: "仅 dry-run：已审阅的分支或提交 SHA；留空时使用 tag"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_MODE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.signed_updates) || (github.event_name == 'push' && vars.GPUSCOUT_SIGNED_UPDATES == 'true')) && 'signed' || 'installers' }}
  TAG: ${{ inputs.tag || github.ref_name }}
  BUILD_REF: ${{ inputs.dry_run && inputs.build_ref || inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: 检查版本号
    runs-on: ubuntu-latest
    steps:
      - name: 正式发布只允许 tag
        if: ${{ inputs.build_ref && !inputs.dry_run }}
        run: echo "::error::build_ref 仅允许用于 dry-run" && exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tag 和三处版本号一致
        run: node scripts/version.mjs check "$TAG"
      - name: 检查发布模式配置
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.RELEASE_MODE == 'signed' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.RELEASE_MODE == 'signed' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ env.RELEASE_MODE == 'signed' && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
        run: node scripts/updater-artifacts.mjs config "$RUNNER_TEMP/updater-config.json" "$RELEASE_MODE"
      - name: 这个版本还没发布过
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 草稿用 tag 查不到，所以翻列表
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" |
          while read -r id draft; do
            if [ "$draft" = "true" ]; then
              echo "删掉旧流程留下的草稿 $id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            else
              echo "::error::$TAG 已经发布过了，不覆盖已发布的安装包。要重新发就换一个版本号。"
              exit 1
            fi
          done

  build:
    name: 打包（${{ matrix.name }}）
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            key: windows-x64
            os: windows-latest
            args: ""
            targets: ""
          - name: macOS Apple 芯片
            key: macos-aarch64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            targets: aarch64-apple-darwin
          - name: macOS Intel
            key: macos-x64
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            targets: x86_64-apple-darwin
          # 用较老的 Ubuntu 构建，glibc 版本低，能在更多发行版上运行
          - name: Linux x64
            key: linux-x64
            os: ubuntu-22.04
            args: "--verbose"
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Linux 打包需要的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libfuse2：打 AppImage 用的 linuxdeploy 本身是 AppImage，要 FUSE 才能运行
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libfuse2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.key }}
      - run: npm ci
      - name: 清掉缓存里可能残留的旧版本安装包
        shell: bash
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle
      # appimagetool 打包时自己去 GitHub 下载 AppImage runtime，失败一次（504）就整个失败、没有重试。
      # 先用带重试的 curl 下好，通过 LDAI_RUNTIME_FILE 交给 linuxdeploy 的 appimage 插件
      - name: 下载 AppImage runtime
        if: runner.os == 'Linux'
        run: |
          f="$RUNNER_TEMP/appimage-runtime-x86_64"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 -o "$f" \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "LDAI_RUNTIME_FILE=$f" >> "$GITHUB_ENV"
      - name: 写入打包配置
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.RELEASE_MODE == 'signed' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.RELEASE_MODE == 'signed' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ env.RELEASE_MODE == 'signed' && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
        run: node scripts/updater-artifacts.mjs config "$RUNNER_TEMP/updater-config.json" "$RELEASE_MODE"
      - name: 打包
        shell: bash
        run: |
          if [ "$RELEASE_MODE" = "installers" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PATH TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_UPDATER_PUBLIC_KEY
          fi
          npm run tauri build -- --config "$RUNNER_TEMP/updater-config.json" ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.RELEASE_MODE == 'signed' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.RELEASE_MODE == 'signed' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # 没有 FUSE 时让 linuxdeploy 解压后运行（只对 Linux 有用）
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: 存下安装包
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.key }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/nsis/*.exe.sig
            src-tauri/target/**/release/bundle/msi/*.msi.sig
            src-tauri/target/**/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig

  # 所有平台都成功才会跑到这里（needs 里有失败就跳过），一次性创建并发布
  publish:
    name: 发布 Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装更新签名校验工具
        if: ${{ env.RELEASE_MODE == 'signed' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsodium-dev
          bash scripts/install-minisign.sh "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: false
      - name: 整理平台产物，拒绝重名和旧文件
        run: |
          mkdir out
          node scripts/updater-artifacts.mjs collect dist out "$TAG"
      - name: 生成发布说明
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'MD'
          ## 下载与更新

          Windows 推荐使用 NSIS 安装程序（`*_x64-setup.exe`）；批量部署仍可使用 MSI。
          macOS 提供 Apple 芯片与 Intel 的 DMG 安装包；Linux 提供 deb、rpm 和 AppImage。
          下载后可用同一发布中的 `checksums.txt` 核对 SHA-256。
          Linux：`sha256sum -c checksums.txt`（需下载清单列出的文件）。
          Windows PowerShell：`Get-FileHash .\GPUScout_* -Algorithm SHA256`，与清单逐项比对。
          macOS 也可用 `shasum -a 256 -c checksums.txt`。

          MD
          if [ "$RELEASE_MODE" = "signed" ]; then
            cat >> notes.md <<'MD'
          此版本额外提供签名更新包和 `latest.json`，支持 Windows NSIS、macOS 和 Linux AppImage 的应用内更新；deb/rpm、MSI 使用对应安装包升级。首个接入自动更新的版本仍需手动安装一次。

          MD
          else
            cat >> notes.md <<'MD'
          此版本发布普通安装包，使用手动下载升级，未启用应用内自动更新。

          MD
          fi
          cat >> notes.md <<'MD'
          Tauri 更新签名与 Windows 代码签名或 Apple 公证是不同机制；系统首次运行可能提示未签名。Linux 需要系统托盘和钥匙串支持。

          MD
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$(git rev-parse HEAD)" --jq .body >> notes.md
      - name: 校验所有更新签名并生成清单
        if: ${{ env.RELEASE_MODE == 'signed' }}
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/updater-artifacts.mjs manifest out "$TAG" "$GITHUB_REPOSITORY" notes.md
      - name: 验证平台完整性并生成 SHA-256 校验清单
        run: node scripts/updater-artifacts.mjs checksums out "$TAG" "$RELEASE_MODE"
      - name: 留存已核验的发布文件（包括 dry-run）
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ env.TAG }}
          if-no-files-found: error
          retention-days: 7
          path: out/*
      - name: 发布
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "GPUScout $TAG" --notes-file notes.md
